
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reports - Expense Tracker</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/reports.css">
</head>

<body>

    <div class="layout">

        <!-- Sidebar -->
        <aside class="sidebar">

            <a class="brand" href="dashboard.html">
        <img src="assets/images/icon.png"
         alt="Expense Tracker Logo"
         class="app-logo">
        <span>Expense Tracker</span>
    </a>

            <nav class="side-nav">

                <a href="dashboard.html">
                    ⌂ <span>Dashboard</span>
                </a>

                <a href="add-transaction.html">
                    ＋ <span>Add Transaction</span>
                </a>

                <a href="budget.html">
                    ▣ <span>Budget</span>
                </a>

                <a class="active" href="reports.html">
                    ◈ <span>Reports</span>
                </a>

                <a href="profile.html">
                    ♙ <span>Profile</span>
                </a>

                <a href="about.html">
                    ⓘ <span>About</span>
                </a>

            </nav>

            <a class="logout" id="logout">
                ↪ Logout
            </a>

        </aside>

        <!-- Main Content -->
        <main class="content">

            <header class="page-head">

                <h1>Reports</h1>

                <!-- Report Filters -->
                <div class="filters">

                    <input
                        id="reportMonth"
                        type="month">

                    <select id="reportCategory">

                        <option value="">All Categories</option>
                        <option>Food</option>
                        <option>Transport</option>
                        <option>Shopping</option>
                        <option>Bills</option>
                        <option>Others</option>

                    </select>

                </div>

            </header>

            <!-- Reports Grid -->
            <section class="reports-grid">

                <article class="panel">

                    <h2>Monthly Expense Overview</h2>

                    <canvas id="monthlyChart"></canvas>

                </article>

                <article class="panel">

                    <h2>Category-wise Expenses</h2>

                    <canvas id="reportCategoryChart"></canvas>

                </article>

            </section>

        </main>

    </div>

    <!-- JavaScript Files -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/main.js"></script>
    <script src="js/reports.js"></script>

</body>
</html>
