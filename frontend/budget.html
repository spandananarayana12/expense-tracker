<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Budget - Expense Tracker</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/budget.css">

</head>

<body>

    <div class="layout">

        <!-- SIDEBAR -->

        <aside class="sidebar">

              <a class="brand" href="dashboard.html">
        <img src="assets/images/icon.png"
         alt="Expense Tracker Logo"
         class="app-logo">
        <span>Expense Tracker</span>
    </a>


            <!-- NAVIGATION MENU -->

            <nav class="side-nav">

                <a href="dashboard.html">
                    ⌂
                    <span>Dashboard</span>
                </a>

                <a href="add-transaction.html">
                    ＋
                    <span>Add Transaction</span>
                </a>

                <a class="active" href="budget.html">
                    ▣
                    <span>Budget</span>
                </a>

                <a href="reports.html">
                    ◈
                    <span>Reports</span>
                </a>

                <a href="profile.html">
                    ♙
                    <span>Profile</span>
                </a>

                <a href="about.html">
                    ⓘ
                    <span>About</span>
                </a>

            </nav>


            <!-- LOGOUT -->

            <a class="logout" id="logout">
                ↪ Logout
            </a>

        </aside>


        <!-- MAIN CONTENT -->

        <main class="content">


            <!-- PAGE HEADER -->

            <header class="page-head">

                <h1>Budget</h1>

            </header>


            <!-- BUDGET SUMMARY CARDS -->

            <section class="stat-grid">

                <article class="stat-card income">

                    <span>
                        Total Budget
                    </span>

                    <strong id="totalBudget">
                        ₹0
                    </strong>

                </article>


                <article class="stat-card expense">

                    <span>
                        Spent
                    </span>

                    <strong id="spent">
                        ₹0
                    </strong>

                </article>


                <article class="stat-card balance">

                    <span>
                        Remaining
                    </span>

                    <strong id="remaining">
                        ₹0
                    </strong>

                </article>

            </section>


            <!-- BUDGET GRID -->

            <section class="budget-grid">


                <!-- SET MONTHLY BUDGET -->

                <article class="panel">

                    <h2>
                        Set Monthly Budget
                    </h2>


                    <form id="budgetForm">


                        <!-- CATEGORY -->

                        <label>

                            Category

                            <select id="budgetCategory">

                                <option value="">
                                    Select category
                                </option>

                                <option>Food</option>

                                <option>Transport</option>

                                <option>Shopping</option>

                                <option>Bills</option>

                                <option>Others</option>

                            </select>

                        </label>


                        <!-- AMOUNT -->

                        <label>

                            Amount

                            <input
                                id="budgetAmount"
                                type="number"
                                min="0"
                                step="0.01"
                                placeholder="Enter amount"
                                required
                            >

                        </label>


                        <!-- SUBMIT BUTTON -->

                        <button
                            class="btn primary full"
                            type="submit"
                        >
                            Set Budget
                        </button>


                        <!-- MESSAGE -->

                        <div
                            id="budgetMessage"
                            class="message"
                        ></div>

                    </form>

                </article>


                <!-- BUDGET OVERVIEW -->

                <article class="panel">

                    <h2>
                        Budget Overview
                    </h2>

                    <div id="budgetOverview"></div>

                </article>

            </section>

        </main>

    </div>


    <!-- JAVASCRIPT FILES -->

    <script src="js/main.js"></script>

    <script src="js/budget.js"></script>

</body>

</html>
